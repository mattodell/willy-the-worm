# Runs on every push and pull request: every file in worlds/ must be a valid, playable world,
# and worlds/index.json must list exactly those worlds.
name: Validate worlds
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/make-manifest.py --check
